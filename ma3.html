<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos - Scrum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="secondary-page">
    <main class="page-shell">
      <section class="page-card">
        <p class="eyebrow">Clase 3</p>
        <h1>Eventos - Scrum</h1>

        <div class="slider-shell">
          <h2 id="slideTitle"></h2>
          <div id="slideContent" class="slide-content"></div>
          <div class="slider-nav">
            <button class="section-action-btn" id="prevSlideBtn" type="button" hidden>Anterior</button>
            <button class="section-action-btn" id="nextSlideBtn" type="button">Siguiente</button>
            <button class="section-action-btn" id="activityBtn" type="button" hidden>Actividad</button>
          </div>
        </div>

        <div class="detail-actions">
          <a class="back-link" href="metodologias-agiles.html">← Volver a clases</a>
        </div>
      </section>
    </main>

    <script>
      const slideTitle = document.getElementById('slideTitle');
      const slideContent = document.getElementById('slideContent');
      const prevSlideBtn = document.getElementById('prevSlideBtn');
      const nextSlideBtn = document.getElementById('nextSlideBtn');
      const activityBtn = document.getElementById('activityBtn');
      let currentSlide = 0;

      const slides = [
        {
          html: `
            <div class="image-slide">
              <img src="img/ma_backlog1.png" alt="Imagen ma_backlog1.png" />
            </div>
          `
        },
        {
          title: '¿Qué es el Product Backlog?',
          html: `
            <div class="modal-columns">
              <article class="modal-section">
                <h3>El Product Backlog es:</h3>
                <ul>
                  <li>Una lista emergente y ordenada de lo necesario para mejorar el producto</li>
                  <li>La fuente de trabajo realizada por el Scrum Team</li>
                  <li>Un artefacto que evoluciona a medida que se aprende</li>
                  <li>El espacio donde se hacen visibles necesidades, oportunidades y problemas</li>
                </ul>
              </article>

              <article class="modal-section">
                <h3>El Product Backlog NO es:</h3>
                <ul>
                  <li>Un contrato cerrado</li>
                  <li>Una lista infinita de pedidos</li>
                  <li>Un cronograma detallado de todo el proyecto</li>
                  <li>El depósito donde descansan ideas olvidadas</li>
                </ul>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                El backlog representa lo que hoy creemos que conviene hacer, no una promesa eterna.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Concepto</h3>
              <p>
                La Guía Scrum define el Product Backlog como una lista emergente y ordenada de lo necesario para mejorar el producto. También establece que es la única fuente del trabajo realizado por el Scrum Team.
              </p>
            </section>
          `
        },
        {
          title: 'Backlog vivo vs. backlog estático',
          html: `
            <table class="priority-matrix">
              <thead>
                <tr>
                  <th>Backlog vivo</th>
                  <th>Backlog estático</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Cambia con el aprendizaje</td>
                  <td>Conserva requisitos antiguos</td>
                </tr>
                <tr>
                  <td>Se ordena con frecuencia</td>
                  <td>Acumula ítems sin revisar</td>
                </tr>
                <tr>
                  <td>Incorpora feedback</td>
                  <td>Sigue un plan aunque pierda sentido</td>
                </tr>
                <tr>
                  <td>Elimina trabajo sin valor</td>
                  <td>Confunde antigüedad con prioridad</td>
                </tr>
                <tr>
                  <td>Mira el próximo objetivo</td>
                  <td>Intenta predecir todo el proyecto</td>
                </tr>
              </tbody>
            </table>

            <section class="modal-section highlight-blue">
              <h3>Idea clave</h3>
              <p>Un backlog cambia cuando aparecen:</p>
              <ul>
                <li>Nuevas evidencias de usuarios</li>
                <li>Cambios regulatorios</li>
                <li>Resultados de un Incremento</li>
                <li>Riesgos técnicos</li>
                <li>Movimientos del mercado</li>
                <li>Nuevas restricciones de capacidad</li>
              </ul>
            </section>

            <section class="modal-section">
              <h3>Mensaje central</h3>
              <p>
                Un backlog que nunca cambia probablemente no está aprendiendo.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta generadora</h3>
              <p>
                ¿Cuándo fue la última vez que una evidencia hizo cambiar el orden de su backlog?
              </p>
            </section>
          `
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/ma_backlog2.png" alt="Imagen ma_backlog2.png" />
            </div>
          `
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/ma_backlog3.png" alt="Imagen ma_backlog3.png" />
            </div>
          `
        },
        {
          title: 'Refinamiento: preparar sin sobreplanificar',
          html: `
            <section class="modal-section">
              <h3>El refinamiento puede incluir:</h3>
              <ul>
                <li>Dividir ítems grandes</li>
                <li>Aclarar resultados esperados</li>
                <li>Identificar dependencias</li>
                <li>Analizar riesgos</li>
                <li>Incorporar criterios de aceptación</li>
                <li>Revisar el orden</li>
                <li>Estimar el tamaño</li>
                <li>Eliminar ítems obsoletos</li>
              </ul>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Importante</h3>
              <p>El Product Backlog Refinement:</p>
              <ul>
                <li>Es una actividad continua</li>
                <li>No es un evento formal de Scrum</li>
                <li>Puede realizarse cuando el equipo lo necesite</li>
                <li>Involucra colaboración entre Product Owner y Developers</li>
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Concepto</h3>
              <p>
                La Guía Scrum lo describe como la actividad de descomponer y precisar los ítems mediante detalles como descripción, orden y tamaño.
              </p>
            </section>

            <section class="modal-section">
              <h3>Punto clave</h3>
              <p>
                Refinar no es llenar campos en Jira. Es reducir incertidumbre mediante conversación.
              </p>
            </section>
          `
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/ma_backlog4.png" alt="Imagen ma_backlog4.png" />
            </div>
          `
        },
        {
          title: 'Product Goal: el norte del backlog',
          html: `
            <section class="modal-section">
              <p>
                El Product Goal describe un estado futuro del producto que el Scrum Team quiere alcanzar.
              </p>
              <h3>Funciona como:</h3>
              <ul>
                <li>Dirección de largo plazo</li>
                <li>Filtro de priorización</li>
                <li>Punto de alineación</li>
                <li>Compromiso asociado al Product Backlog</li>
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Ejemplo — Product Goal</h3>
              <p>
                Conseguir que el 80% de los envíos de la plataforma sean neutrales en carbono antes de finalizar el año.
              </p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Ítems alineados</h3>
                <ul>
                  <li>Optimizar rutas logísticas</li>
                  <li>Medir emisiones por envío</li>
                  <li>Incorporar opciones de entrega sostenible</li>
                </ul>
              </article>

              <article class="modal-section">
                <h3>Ítem menos alineado</h3>
                <ul>
                  <li>Agregar veinte filtros nuevos de color</li>
                </ul>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <h3>Mensaje central</h3>
              <p>
                Un backlog sin Product Goal puede estar muy ocupado y, aun así, no avanzar hacia ninguna parte.
              </p>
            </section>
          `
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/ma_historia1.png" alt="Imagen ma_historia1.png" />
            </div>
          `
        },
        {
          title: 'Una historia no es un ticket',
          html: `
            <section class="modal-section">
              <p>
                Una Historia de Usuario expresa una necesidad desde la perspectiva de quien obtendrá valor.
              </p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Sirve para:</h3>
                <ul>
                  <li>Centrar la conversación en el usuario</li>
                  <li>Explicar la necesidad</li>
                  <li>Comunicar el resultado esperado</li>
                  <li>Evitar soluciones prematuras</li>
                  <li>Facilitar colaboración</li>
                  <li>Dividir el producto en incrementos abordables</li>
                </ul>
              </article>

              <article class="modal-section">
                <h3>NO es:</h3>
                <ul>
                  <li>Una descripción técnica completa</li>
                  <li>Un formulario administrativo</li>
                  <li>Un reemplazo de la conversación</li>
                  <li>Una especificación contractual</li>
                </ul>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <h3>Concepto</h3>
              <p>
                Agile Alliance señala que las historias permiten dividir objetivos funcionales, representar roles relevantes, expresar valor y relacionar criterios de aceptación verificables.
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                La historia es un medio para comprender el problema, no un recipiente para encerrar la solución.
              </p>
            </section>
          `
        },
        {
          title: 'Las 3C de una Historia de Usuario',
          html: `
            <section class="modal-section">
              <h3>CARD — Tarjeta</h3>
              <p>
                Una descripción breve que permite recordar la necesidad.
              </p>
            </section>

            <section class="modal-section">
              <h3>CONVERSATION — Conversación</h3>
              <p>
                El diálogo mediante el cual equipo, Product Owner y personas relevantes exploran:
              </p>
              <ul>
                <li>Contexto</li>
                <li>Valor</li>
                <li>Alternativas</li>
                <li>Riesgos</li>
                <li>Excepciones</li>
                <li>Alcance</li>
              </ul>
            </section>

            <section class="modal-section">
              <h3>CONFIRMATION — Confirmación</h3>
              <p>
                Condiciones observables que permiten verificar que la necesidad fue satisfecha.
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Mensaje central</h3>
              <p>
                La tarjeta conserva la idea. La conversación construye el entendimiento. La confirmación verifica el resultado.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Concepto</h3>
              <p>
                El modelo Card–Conversation–Confirmation fue propuesto por Ron Jeffries para diferenciar las historias sociales y colaborativas de los requisitos puramente documentales.
              </p>
            </section>
          `
        },
        {
          title: 'Como / Quiero / Para',
          html: `
            <section class="modal-section">
              <h3>Plantilla</h3>
              <blockquote class="manifesto-quote">
                Como [tipo de usuario]<br />
                Quiero [necesidad o capacidad]<br />
                Para [resultado o valor esperado]
              </blockquote>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Ejemplo débil</h3>
                <p>
                  El sistema debe tener un botón para recuperar la contraseña.
                </p>
              </article>

              <article class="modal-section">
                <h3>Ejemplo mejorado</h3>
                <p>
                  Como usuario registrado, quiero restablecer mi contraseña de forma autónoma para recuperar rápidamente el acceso a mi cuenta.
                </p>
              </article>
            </div>

            <section class="modal-section">
              <h3>¿Qué mejora?</h3>
              <ul>
                <li>Identifica al usuario</li>
                <li>Expresa una necesidad</li>
                <li>Explica el valor</li>
                <li>Permite conversar sobre distintas soluciones</li>
              </ul>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Mensaje central</h3>
              <p>
                "Para" es la parte que evita convertir la historia en una simple orden de construcción.
              </p>
            </section>
          `
        },
        {
          title: 'INVEST: filtro de calidad',
          html: `
            <section class="modal-section">
              <h3>Una historia debería ser:</h3>
              <ul>
                <li><strong>I</strong> — Independent: Independiente</li>
                <li><strong>N</strong> — Negotiable: Negociable</li>
                <li><strong>V</strong> — Valuable: Valiosa</li>
                <li><strong>E</strong> — Estimable: Estimable</li>
                <li><strong>S</strong> — Small: Pequeña</li>
                <li><strong>T</strong> — Testable: Comprobable</li>
              </ul>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Uso correcto</h3>
              <p>
                INVEST no es una auditoría para aprobar o rechazar personas.
              </p>
              <p>Es una guía para detectar que la historia necesita:</p>
              <ul>
                <li>Más conversación</li>
                <li>Mejor división</li>
                <li>Mayor evidencia</li>
                <li>Menos prescripción</li>
                <li>Criterios más claros</li>
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Concepto</h3>
              <p>
                Agile Alliance reconoce INVEST como una lista de comprobación para evaluar, reformular o dividir historias.
              </p>
            </section>

            <section class="modal-section">
              <h3>Mensaje central</h3>
              <p>
                Cuando una historia falla INVEST, no se castiga: se mejora.
              </p>
            </section>
          `
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/ma_historia3.png" alt="Imagen ma_historia3.png" />
            </div>
          `
        },
        {
          title: 'Slicing: cortar por valor',
          html: `
            <section class="modal-section">
              <p>
                Una épica no debería dividirse solamente por capas técnicas:
              </p>
            </section>

            <section class="modal-section">
              <h3>División poco recomendable</h3>
              <ul>
                <li>Crear base de datos</li>
                <li>Crear API</li>
                <li>Crear interfaz</li>
                <li>Realizar pruebas</li>
              </ul>
              <p>
                Cada parte aislada entrega poco o ningún valor observable.
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>División vertical</h3>
              <ul>
                <li>Transferir a un beneficiario existente</li>
                <li>Registrar un nuevo beneficiario</li>
                <li>Programar una transferencia futura</li>
                <li>Consultar el estado de la transferencia</li>
                <li>Cancelar una transferencia pendiente</li>
              </ul>
              <p>
                Cada historia atraviesa las capas necesarias y produce un comportamiento demostrable.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Mensaje central</h3>
              <p>
                Dividir bien no significa repartir tareas. Significa encontrar incrementos pequeños de valor.
              </p>
            </section>
          `
        },
        {
          title: 'Criterios de Aceptación',
          html: `
            <section class="modal-section">
              <p>
                Los Criterios de Aceptación describen condiciones específicas que debe cumplir una historia.
              </p>
              <h3>Deben ser:</h3>
              <ul>
                <li>Claros</li>
                <li>Observables</li>
                <li>Relevantes</li>
                <li>Comprobables</li>
                <li>Específicos de la historia</li>
              </ul>
            </section>

            <section class="modal-section">
              <h3>Formato Gherkin</h3>
              <blockquote class="manifesto-quote">
                Dado un contexto inicial<br />
                Cuando ocurre una acción<br />
                Entonces se observa un resultado
              </blockquote>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Ejemplo</h3>
              <p>
                Dado que el usuario está en la pantalla de recuperación, cuando ingresa un correo registrado y solicita el enlace, entonces el sistema muestra una confirmación y envía instrucciones al correo.
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Mensaje central</h3>
              <p>
                Los criterios convierten expectativas ambiguas en comportamientos verificables.
              </p>
            </section>
          `
        }
      ];

      function renderSlide() {
        const slide = slides[currentSlide];
        slideTitle.textContent = slide.title || '';
        slideContent.innerHTML = slide.html;
        prevSlideBtn.hidden = currentSlide === 0;
        nextSlideBtn.disabled = currentSlide === slides.length - 1;
        nextSlideBtn.textContent = currentSlide === slides.length - 1 ? 'Final' : 'Siguiente';
        activityBtn.hidden = currentSlide !== slides.length - 1;
      }

      prevSlideBtn.addEventListener('click', () => {
        currentSlide = Math.max(0, currentSlide - 1);
        renderSlide();
      });

      nextSlideBtn.addEventListener('click', () => {
        currentSlide = Math.min(slides.length - 1, currentSlide + 1);
        renderSlide();
      });

      activityBtn.addEventListener('click', () => {
        window.location.href = 'https://miro.com/app/board/uXjVH6syhgc=/';
      });

      renderSlide();
    </script>
  </body>
</html>
