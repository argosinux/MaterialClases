<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase 8 - Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="secondary-page">
    <main class="page-shell">
      <section class="page-card">
        <p class="eyebrow">Clase 8 - Kanban</p>

        <div class="slider-shell">
          <h2 id="slideTitle"></h2>
          <div id="slideContent" class="slide-content"></div>
          <div class="slider-nav">
            <button class="section-action-btn" id="prevSlideBtn" type="button" hidden>
              Anterior
            </button>
            <button class="section-action-btn" id="nextSlideBtn" type="button">
              Siguiente
            </button>
          </div>
        </div>

        <a class="back-link" href="metodologias-agiles.html">← Volver a clases</a>
      </section>
    </main>

    <script>
      function initSlider(titleEl, contentEl, prevBtn, nextBtn, slides) {
        let current = 0;

        function render() {
          const slide = slides[current];
          titleEl.textContent = slide.title || "";
          contentEl.innerHTML = slide.html;
          prevBtn.hidden = current === 0;
          nextBtn.disabled = current === slides.length - 1;
          nextBtn.textContent = current === slides.length - 1 ? "Final" : "Siguiente";
        }

        prevBtn.addEventListener("click", () => {
          current = Math.max(0, current - 1);
          render();
        });

        nextBtn.addEventListener("click", () => {
          current = Math.min(slides.length - 1, current + 1);
          render();
        });

        render();
      }

      const slides = [
        {
          html: `
            <div class="image-slide">
              <img src="img/MA_80.png" alt="Kanban" />
            </div>
          `,
        },
        {

              <p>Toyota encontró una analogía útil en los:</p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>🛒 SUPERMERCADOS</h3>
            </section>

            <section class="modal-section">
              <p>Imagine un supermercado.</p>
              <p>El supermercado no coloca:</p>
              <p><strong>5.000 botellas de leche en una estantería</strong></p>
              <p>solo porque tiene capacidad para comprarlas.</p>
            </section>

            <section class="modal-section">
              <ol>
                <li>el cliente retira productos;</li>
                <li>disminuye el inventario;</li>
                <li>esa disminución genera una señal;</li>
                <li>se repone únicamente lo consumido.</li>
              </ol>
            </section>

            <section class="modal-section highlight-quote">
              <p>Toyota describe precisamente que parte de la inspiración del sistema vino de los supermercados, donde los productos vendidos son posteriormente repuestos.</p>

            <section class="modal-section highlight-blue">
              <p>La idea cambia radicalmente la lógica de producción.</p>
            </section>
          `,
        },
        {
          html: `
            <div class="image-slide">

            </div>
          `,
        },
        {

          html: `

                <li>cuándo debía reponerse;</li>

                <li>hacia qué proceso.</li>

            <section class="modal-section highlight-blue">

              <p><strong>SE GENERA UNA SEÑAL</strong></p>

          `,
        },

                <h3>INVENTARIO EXCESIVO</h3>
                <p>Acumular trabajo entre procesos.</p>

                <h3>ESPERA</h3>

                <p>Una etapa produce mucho más rápido de lo que la siguiente puede consumir.</p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <p><strong>No producir porque puedo. Producir porque existe una necesidad y capacidad del sistema.</strong></p>

          html: `

          `,
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/MA_85.png" alt="Kanban" />

        },
        {

      initSlider(

        document.getElementById("slideContent"),
        document.getElementById("prevSlideBtn"),

    </script>
