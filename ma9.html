<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pensamiento Lean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="secondary-page">
    <main class="page-shell">
      <section class="page-card">
        <p class="eyebrow">Pensamiento Lean</p>
        <h1>Pensamiento Lean</h1>

        <div class="slider-shell">
          <h2 id="slideTitle"></h2>
          <div id="slideContent" class="slide-content"></div>
          <div class="slider-nav">
            <button class="section-action-btn" id="prevSlideBtn" type="button" hidden>
              Anterior
            </button>
            <button class="section-action-btn" id="nextSlideBtn" type="button">
              Siguiente
            </button>
          </div>
        </div>

        <a class="back-link" href="metodologias-agiles.html">← Volver a clases</a>
      </section>
    </main>

    <script>
      function initSlider(titleEl, contentEl, prevBtn, nextBtn, slides) {
        let current = 0;

        function render() {
          const slide = slides[current];
          titleEl.textContent = slide.title || "";
          contentEl.innerHTML = slide.html;
          prevBtn.hidden = current === 0;
          nextBtn.disabled = current === slides.length - 1;
          nextBtn.textContent = current === slides.length - 1 ? "Final" : "Siguiente";
        }

        prevBtn.addEventListener("click", () => {
          current = Math.max(0, current - 1);
          render();
        });

        nextBtn.addEventListener("click", () => {
          current = Math.min(slides.length - 1, current + 1);
          render();
        });

        render();
      }

      const slides = [
        {
          title: "¿Qué es realmente el valor?",
          html: `
            <section class="modal-section">
              <ul>
                <li>El pensamiento Lean tiene su origen en el <strong>Sistema de Producción de Toyota</strong> (Japón, posguerra), desarrollado para eliminar el desperdicio y producir solo lo necesario.</li>
                <li>Años después, esa filosofía fue adoptada por la industria del software.</li>
                <li><strong>Valor</strong> = únicamente aquello por lo que el cliente paga o a lo que dedica su tiempo.</li>
                <li>Todo lo demás — por más sofisticado que sea técnicamente — es <strong>desperdicio (muda)</strong>.</li>
              </ul>
              <p>
                <em>Ejemplo:</em> 📹❌ Vitalis — una videollamada en 4K que nadie pidió no es valor, es desperdicio.
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                "Si el usuario no lo pediría ni lo notaría, es desperdicio."
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta generadora</h3>
              <p>
                ¿Qué función de una app que usás todos los días creés que nadie pidió?
              </p>
            </section>
          `,
        },
        {
          html: `
            <div class="image-slide">
              <img src="img/MA9.jpg" alt="Pensamiento Lean" />
            </div>
          `,
        },
                {
          html: `
            <div class="image-slide">
              <img src="img/MA91.jpg" alt="Pensamiento Lean" />
            </div>
          `,
        },
                        {
          html: `
            <div class="image-slide">
              <img src="img/MA92.jpg" alt="Pensamiento Lean" />
            </div>
          `,
        },
                        {
          html: `
            <div class="image-slide">
              <img src="img/MA94.jpg" alt="Pensamiento Lean" />
            </div>
          `,
        },
                        {
          html: `
            <div class="image-slide">
              <img src="img/MA93.jpg" alt="Pensamiento Lean" />
            </div>
          `,
        },
        {
          title: "Iterar ≠ Incrementar",
          html: `
            <section class="modal-section">
              <div class="modal-columns">
                <article class="modal-section">
                  <h3>🏠 Incremental</h3>
                  <p>Sumar piezas: una habitación terminada se agrega a las anteriores.</p>
                </article>

                <article class="modal-section">
                  <h3>🎨 Iterativo</h3>
                  <p>Refinar lo que ya existe: un boceto que gana volumen, color y detalle.</p>
                </article>
              </div>
              <p>
                <em>Ejemplo:</em> una casa que crece pieza por pieza (incremental) frente a un dibujo que pasa de boceto a obra terminada (iterativo).
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                "La iteración es el envase de tiempo. El incremento es lo que hay adentro."
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta generadora</h3>
              <p>
                ¿Vivieron algún proyecto con muchas reuniones organizadas y poco para mostrar al final?
              </p>
            </section>
          `,
        },
      ];

      initSlider(
        document.getElementById("slideTitle"),
        document.getElementById("slideContent"),
        document.getElementById("prevSlideBtn"),
        document.getElementById("nextSlideBtn"),
        slides
      );
    </script>
  </body>
</html>
