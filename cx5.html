<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase 5 - Midiendo la experiencia del cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="secondary-page">
    <main class="page-shell">
      <section class="page-card">
        <p class="eyebrow">Clase 5 - Midiendo la experiencia del cliente</p>
        <div class="slider-shell">
          <h2 id="slideTitle"></h2>
          <div id="slideContent" class="slide-content"></div>
          <div class="slider-nav">
            <button class="section-action-btn" id="prevSlideBtn" type="button" hidden>Anterior</button>
            <button class="section-action-btn" id="nextSlideBtn" type="button">Siguiente</button>
          </div>
        </div>

        <div class="detail-actions">
          <a class="back-link" href="customerexperience.html">Volver a clases</a>
        </div>
      </section>
    </main>

    <script>
      function initSlider(titleEl, contentEl, prevBtn, nextBtn, slides) {
        let current = 0;

        function render() {
          const slide = slides[current];
          titleEl.textContent = slide.title;
          contentEl.innerHTML = slide.html;
          prevBtn.hidden = current === 0;
          nextBtn.disabled = current === slides.length - 1;
          nextBtn.textContent = current === slides.length - 1 ? "Final" : "Siguiente";
        }

        prevBtn.addEventListener("click", () => {
          current = Math.max(0, current - 1);
          render();
        });

        nextBtn.addEventListener("click", () => {
          current = Math.min(slides.length - 1, current + 1);
          render();
        });

        render();
      }

      const slides = [
        {
          title: "MIDIENDO LA EXPERIENCIA DEL CLIENTE",
          html: `
            <section class="modal-section">
              <p><strong>Lo que no medimos, lo interpretamos.</strong></p>
              <p><strong>Lo que medimos mal, lo decidimos mal.</strong></p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>EXPERIENCIA -> DATO -> INSIGHT -> DECISION -> RESULTADO</h3>
            </section>

            <section class="modal-section">
              <h3>Durante las clases anteriores:</h3>
              <ul>
                <li>Entendimos al cliente.</li>
                <li>Construimos el Customer Journey Map.</li>
                <li>Identificamos momentos de verdad.</li>
                <li>Disenamos el Service Blueprint.</li>
                <li>Detectamos fricciones.</li>
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Ahora aparece una nueva pregunta:</h3>
              <p>Como sabemos si la experiencia realmente esta funcionando?</p>
            </section>

            <section class="modal-section">
              <h3>Punto clave</h3>
              <p>Medir CX no consiste en coleccionar encuestas.</p>
              <p>Consiste en producir evidencia para decidir.</p>
            </section>
          `,
        },
        {
          title: "La pregunta incomoda",
          html: `
            <section class="modal-section">
              <p>Imaginen que pueden hacerle una sola pregunta a Laura. <strong>Cual elegirian?</strong></p>
            </section>

            <section class="modal-section">
              <h3>Ejemplos</h3>
              <ul>
                <li>Esta satisfecha?</li>
                <li>Nos recomendaria?</li>
                <li>Fue facil comprar?</li>
                <li>Volveria a comprar?</li>
                <li>Que fue lo que mas le molesto?</li>
                <li>Renovara su suscripcion?</li>
              </ul>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Existe realmente "la unica metrica que necesitamos"?</h3>
            </section>
          `,
        },
        {
          title: "Medir CX no es lo mismo que medir satisfaccion",
          html: `
            <section class="modal-section">
              <h3>La experiencia del cliente tiene varias dimensiones</h3>
              <p>Una experiencia puede ser:</p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>SATISFACTORIA</h3>
                <p>"Me gusto el cafe."</p>
              </article>

              <article class="modal-section">
                <h3>FACIL</h3>
                <p>"Pude cambiar mi suscripcion en segundos."</p>
              </article>
            </div>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>MEMORABLE</h3>
                <p>"Me sorprendieron con una recomendacion personalizada."</p>
              </article>

              <article class="modal-section">
                <h3>CONFIABLE</h3>
                <p>"Siempre cumplen lo prometido."</p>
              </article>
            </div>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>RECOMENDABLE</h3>
                <p>"Se lo contaria a otra persona."</p>
              </article>

              <article class="modal-section">
                <h3>RENTABLE PARA EL NEGOCIO</h3>
                <p>"Laura renueva, compra mas y permanece."</p>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <p>Por eso ninguna metrica individual explica toda la experiencia.</p>
            </section>

            <section class="modal-section highlight-quote">
              <p>Qualtrics tambien recomienda observar multiples metricas porque CX tiene distintas dimensiones y una sola medida dificilmente proporciona la imagen completa.</p>
            </section>
          `,
        },
        {
          title: "Qualtrics",
          html: `
            <div class="image-slide">
              <img src="img/qualtrics.png" alt="Qualtrics" />
            </div>
          `,
        },
        {
          title: "Indicadores de CX",
          html: `
            <div class="image-slide">
              <img src="img/CX_indicadores.png" alt="Indicadores de experiencia del cliente" />
            </div>
          `,
        },
        {
          title: "NPS: Net Promoter Score",
          html: `
            <section class="modal-section">
              <h3>Que intenta medir?</h3>
              <p>La disposicion del cliente a recomendar una empresa, producto o servicio.</p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Pregunta clasica</h3>
              <p>"En una escala de 0 a 10, que tan probable es que recomiendes nuestra empresa a un amigo o colega?"</p>
            </section>

            <section class="modal-section">
              <h3>Origen</h3>
              <p>Fue popularizado por Frederick Reichheld en el articulo de Harvard Business Review "The One Number You Need to Grow", publicado en 2003.</p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Como se interpreta</h3>
                <ul>
                  <li>9-10: Promotores</li>
                  <li>7-8: Pasivos</li>
                  <li>0-6: Detractores</li>
                </ul>
              </article>

              <article class="modal-section">
                <h3>Como se calcula</h3>
                <p><strong>NPS = % Promotores - % Detractores</strong></p>
                <p>El resultado puede ir de -100 a 100.</p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <h3>Punto clave</h3>
              <p>NPS no mide toda la experiencia. Resume la intencion de recomendar, que puede funcionar como senal de lealtad, percepcion global y crecimiento potencial.</p>
            </section>
          `,
        },
        {
          title: "Los tres grupos del NPS",
          html: `
            <section class="modal-section">
              <h3>Visual horizontal 0-10</h3>
              <div class="nps-scale" aria-label="Escala NPS de 0 a 10">
                <div class="nps-scale-value">0</div>
                <div class="nps-scale-value">1</div>
                <div class="nps-scale-value">2</div>
                <div class="nps-scale-value">3</div>
                <div class="nps-scale-value">4</div>
                <div class="nps-scale-value">5</div>
                <div class="nps-scale-value">6</div>
                <div class="nps-scale-value">7</div>
                <div class="nps-scale-value">8</div>
                <div class="nps-scale-value">9</div>
                <div class="nps-scale-value">10</div>
                <div class="nps-scale-band nps-band-detractors">DETRACTORES</div>
                <div class="nps-scale-band nps-band-passives">PASIVOS</div>
                <div class="nps-scale-band nps-band-promoters">PROMOTORES</div>
              </div>
            </section>

            <div class="nps-group-grid">
              <article class="modal-section nps-group-card">
                <h3>DETRACTORES</h3>
                <p class="nps-range">0 - 6</p>
                <p>Clientes con una experiencia suficientemente problematica como para representar riesgo de abandono o comentarios negativos.</p>
              </article>

              <article class="modal-section nps-group-card">
                <h3>PASIVOS</h3>
                <p class="nps-range">7 - 8</p>
                <p>Clientes relativamente satisfechos, pero sin una fuerte predisposicion a recomendar.</p>
              </article>

              <article class="modal-section nps-group-card">
                <h3>PROMOTORES</h3>
                <p class="nps-range">9 - 10</p>
                <p>Clientes con mayor predisposicion a recomendar la marca.</p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <p>Bain mantiene esta clasificacion dentro del Net Promoter System.</p>
            </section>
          `,
        },
        {
          title: "Como se calcula el NPS?",
          html: `
            <section class="modal-section highlight-blue">
              <h3>Formula</h3>
              <p><strong>NPS = % Promotores - % Detractores</strong></p>
            </section>

            <section class="modal-section">
              <h3>Ejemplo</h3>
              <p><strong>100 respuestas:</strong></p>
              <ul>
                <li>55 promotores</li>
                <li>25 pasivos</li>
                <li>20 detractores</li>
              </ul>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Entonces</h3>
                <p><strong>NPS = 55% - 20%</strong></p>
              </article>

              <article class="modal-section highlight-blue">
                <h3>Resultado</h3>
                <p><strong>NPS = +35</strong></p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <h3>Importante</h3>
              <p>Los pasivos participan del total de respuestas, pero no aparecen directamente en la resta.</p>
            </section>
          `,
        },
        {
          title: "El debate sobre NPS",
          html: `
            <section class="modal-section">
              <p>En 2003 se presento NPS como una metrica estrechamente relacionada con el crecimiento.</p>
            </section>

            <section class="modal-section">
              <p>Pero la discusion academica continuo.</p>
            </section>

            <section class="modal-section">
              <p>En 2007, Keiningham, Cooil, Andreassen y Aksoy analizaron longitudinalmente la relacion entre Net Promoter y crecimiento de ingresos y no confirmaron que NPS fuera sistematicamente superior a otros indicadores.</p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Conclusion correcta</h3>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>No significa</h3>
                <p><strong>❌ "NPS no sirve".</strong></p>
              </article>

              <article class="modal-section highlight-quote">
                <h3>Significa</h3>
                <p>"NPS no deberia convertirse en religion corporativa."</p>
                <p>Es una senal dentro de un sistema de medicion.</p>
              </article>
            </div>
          `,
        },
        {
          title: "Contexto de NPS",
          html: `
            <div class="image-slide">
              <img src="img/CX_conexto.png" alt="Contexto de NPS" />
            </div>
          `,
        },
        {
          title: "NPS de Laura",
          html: `
            <div class="image-slide">
              <img src="img/CX_npslaura.png" alt="Ejemplo de NPS de Laura" />
            </div>
          `,
        },
        {
          title: "CSAT: Customer Satisfaction Score",
          html: `
            <section class="modal-section">
              <h3>Pregunta que responde</h3>
              <p>Que tan satisfecho quedo el cliente con esta experiencia?</p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Ejemplo</h3>
              <p>"Que tan satisfecho estas con tu ultimo envio?"</p>
            </section>

            <section class="modal-section">
              <h3>Escala frecuente</h3>
              <ul>
                <li>1 estrella: Muy insatisfecho</li>
                <li>2 estrellas</li>
                <li>3 estrellas: Neutral</li>
                <li>4 estrellas: Satisfecho</li>
                <li>5 estrellas: Muy satisfecho</li>
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <p>CSAT mira una fotografia.</p>
              <p>No necesariamente toda la relacion.</p>
            </section>
          `,
        },
        {
          title: "Como se calcula CSAT?",
          html: `
            <section class="modal-section">
              <p>Un metodo muy utilizado es <strong>Top 2 Box</strong>.</p>
              <p>Se consideran positivas las respuestas:</p>
              <p><strong>4 + 5</strong></p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Formula</h3>
              <p><strong>CSAT = Respuestas positivas / Total de respuestas x 100</strong></p>
            </section>

            <section class="modal-section">
              <h3>Ejemplo</h3>
              <p>80 personas respondieron.</p>
              <p>64 eligieron 4 o 5.</p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Calculo</h3>
                <p><strong>CSAT = 64 / 80 x 100</strong></p>
              </article>

              <article class="modal-section highlight-blue">
                <h3>Resultado</h3>
                <p><strong>CSAT = 80%</strong></p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <p>Este metodo de calculo 4-5 sobre una escala de cinco puntos es utilizado ampliamente para CSAT.</p>
            </section>
          `,
        },
        {
          title: "CSAT",
          html: `
            <div class="image-slide">
              <img src="img/CX_csat.png" alt="Ejemplo visual de CSAT" />
            </div>
          `,
        },
        {
          title: "El cuando tambien cambia la respuesta",
          html: `
            <div class="modal-columns">
              <article class="modal-section">
                <h3>30 segundos despues</h3>
                <p>Captura una reaccion inmediata.</p>
              </article>

              <article class="modal-section">
                <h3>24 horas despues</h3>
                <p>Incorpora procesamiento y recuerdo.</p>
              </article>
            </div>

            <section class="modal-section">
              <h3>30 dias despues</h3>
              <p>Captura otra cosa completamente distinta.</p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Por eso toda metrica necesita contexto</h3>
            </section>

            <section class="modal-section">
              <ul>
                <li>QUE preguntamos</li>
                <li>CUANDO preguntamos</li>
                <li>DESPUES DE QUE preguntamos</li>
                <li>A QUIEN preguntamos</li>
              </ul>
            </section>
          `,
        },
        {
          title: "Memoria y medicion",
          html: `
            <div class="image-slide">
              <img src="img/CX_memoria.png" alt="Memoria y medicion de la experiencia" />
            </div>
          `,
        },
        {

          html: `
            <div class="image-slide">
              <img src="img/CX_closed.png" alt="Closed loop en experiencia del cliente" />

          `,

        {
          title: "Una aclaracion: Service Recovery Paradox",
          html: `
            <section class="modal-section highlight-blue">
              <h3>SERVICE RECOVERY PARADOX</h3>
              <p>Una recuperacion excepcional puede, bajo ciertas condiciones, elevar la satisfaccion despues de una falla.</p>
            </section>

            <section class="modal-section">
              <h3>Pero</h3>
              <p>No significa que sea conveniente generar errores.</p>
              <p>Y tampoco significa que un cliente recuperado vaya a ser siempre mas leal que uno que nunca sufrio el problema.</p>
            </section>

            <section class="modal-section">
              <p>Una meta-analisis encontro evidencia mas consistente sobre satisfaccion, pero no un efecto general equivalente sobre recompra, WOM o imagen corporativa.</p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Mensaje</h3>
              <p>La mejor recuperacion sigue siendo no necesitar recuperacion.</p>
            </section>
          `,
        },
      ];

      initSlider(
        document.getElementById("slideTitle"),
        document.getElementById("slideContent"),
        document.getElementById("prevSlideBtn"),
        document.getElementById("nextSlideBtn"),
        slides
      );
    </script>
  </body>
</html>
