<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase 5 - Midiendo la experiencia del cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="secondary-page">
    <main class="page-shell">
      <section class="page-card">
        <p class="eyebrow">Clase 5 - Midiendo la experiencia del cliente</p>

        <div class="slider-shell">
          <h2 id="slideTitle"></h2>
          <div id="slideContent" class="slide-content"></div>
          <div class="slider-nav">
            <button class="section-action-btn" id="prevSlideBtn" type="button" hidden>Anterior</button>
            <button class="section-action-btn" id="nextSlideBtn" type="button">Siguiente</button>
          </div>
        </div>

        <div class="detail-actions">
          <a class="back-link" href="customerexperience.html">← Volver a clases</a>
        </div>
      </section>
    </main>

    <script>
      function initSlider(titleEl, contentEl, prevBtn, nextBtn, slides) {
        let current = 0;

        function render() {
          const slide = slides[current];
          titleEl.textContent = slide.title;
          contentEl.innerHTML = slide.html;
          prevBtn.hidden = current === 0;
          nextBtn.disabled = current === slides.length - 1;
          nextBtn.textContent = current === slides.length - 1 ? "Final" : "Siguiente";
        }

        prevBtn.addEventListener("click", () => {
          current = Math.max(0, current - 1);
          render();
        });

        nextBtn.addEventListener("click", () => {
          current = Math.min(slides.length - 1, current + 1);
          render();
        });

        render();
      }

      const slides = [
        {
          title: "MIDIENDO LA EXPERIENCIA DEL CLIENTE",
          html: `
            <section class="modal-section">
              <p><strong>Lo que no medimos, lo interpretamos.</strong></p>
              <p><strong>Lo que medimos mal, lo decidimos mal.</strong></p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>EXPERIENCIA → DATO → INSIGHT → DECISIÓN → RESULTADO</h3>
            </section>

            <section class="modal-section">
              <h3>Durante las clases anteriores:</h3>
              <ul>
                <li>Entendimos al cliente.</li>
                <li>Construimos el Customer Journey Map.</li>
                <li>Identificamos momentos de verdad.</li>
                <li>Diseñamos el Service Blueprint.</li>
                <li>Detectamos fricciones.</li>
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Ahora aparece una nueva pregunta:</h3>
              <p>¿Cómo sabemos si la experiencia realmente está funcionando?</p>
            </section>

            <section class="modal-section">
              <h3>Punto clave</h3>
              <p>Medir CX no consiste en coleccionar encuestas.</p>
              <p>Consiste en producir evidencia para decidir.</p>
            </section>
          `,
        },
        {
          title: "La pregunta incómoda",
          html: `
            <section class="modal-section">
              <p>Imaginen que pueden hacerle una sola pregunta a Laura.</p>
              <p><strong>¿Cuál elegirían?</strong></p>
            </section>

            <section class="modal-section">
              <h3>Ejemplos</h3>
              <ul>
                <li>¿Está satisfecha?</li>
                <li>¿Nos recomendaría?</li>
                <li>¿Fue fácil comprar?</li>
                <li>¿Volvería a comprar?</li>
                <li>¿Qué fue lo que más le molestó?</li>
                <li>¿Renovará su suscripción?</li>
              </ul>
            </section>

            <section class="modal-section highlight-blue">
              <h3>¿Existe realmente “la única métrica que necesitamos”?</h3>
            </section>

            <section class="modal-section highlight-quote">
              <p>Dejar la pregunta abierta.</p>
            </section>
          `,
        },
        {
          title: "Medir CX ≠ medir satisfacción",
          html: `
            <section class="modal-section">
              <h3>La experiencia del cliente tiene varias dimensiones</h3>
              <p>Una experiencia puede ser:</p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>SATISFACTORIA</h3>
                <p>“Me gustó el café.”</p>
              </article>

              <article class="modal-section">
                <h3>FÁCIL</h3>
                <p>“Pude cambiar mi suscripción en segundos.”</p>
              </article>
            </div>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>MEMORABLE</h3>
                <p>“Me sorprendieron con una recomendación personalizada.”</p>
              </article>

              <article class="modal-section">
                <h3>CONFIABLE</h3>
                <p>“Siempre cumplen lo prometido.”</p>
              </article>
            </div>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>RECOMENDABLE</h3>
                <p>“Se lo contaría a otra persona.”</p>
              </article>

              <article class="modal-section">
                <h3>RENTABLE PARA EL NEGOCIO</h3>
                <p>“Laura renueva, compra más y permanece.”</p>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <p>Por eso ninguna métrica individual explica toda la experiencia.</p>
            </section>

            <section class="modal-section highlight-quote">
              <p>
                Qualtrics también recomienda observar múltiples métricas porque CX tiene distintas dimensiones y una sola medida difícilmente proporciona la imagen completa.
              </p>
            </section>
          `,
        },
        {
          title: "Qualtrics",
          html: `
            <div class="image-slide">
              <img src="img/qualtrics.png" alt="Qualtrics" />
            </div>
          `,
        },
        {
          title: "Indicadores de CX",
          html: `
            <div class="image-slide">
              <img src="img/CX_indicadores.png" alt="Indicadores de experiencia del cliente" />
            </div>
          `,
        },
        {
          title: "NPS: Net Promoter Score",
          html: `
            <section class="modal-section">
              <h3>¿Qué intenta medir?</h3>
              <p>La disposición del cliente a recomendar una empresa, producto o servicio.</p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Pregunta clásica</h3>
              <p>“En una escala de 0 a 10, ¿qué tan probable es que recomiendes nuestra empresa a un amigo o colega?”</p>
            </section>

            <section class="modal-section">
              <h3>Origen</h3>
              <p>
                Fue popularizado por Frederick Reichheld en el artículo de Harvard Business Review
                “The One Number You Need to Grow”, publicado en 2003.
              </p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Cómo se interpreta</h3>
                <ul>
                  <li>9-10: Promotores</li>
                  <li>7-8: Pasivos</li>
                  <li>0-6: Detractores</li>
                </ul>
              </article>

              <article class="modal-section">
                <h3>Cómo se calcula</h3>
                <p><strong>NPS = % Promotores - % Detractores</strong></p>
                <p>El resultado puede ir de -100 a 100.</p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <h3>Punto clave</h3>
              <p>
                NPS no mide toda la experiencia. Resume la intención de recomendar, que puede funcionar como señal de lealtad, percepción global y crecimiento potencial.
              </p>
            </section>
          `,
        },
        {
          title: "¿Cómo se calcula el NPS?",
          html: `
            <section class="modal-section highlight-blue">
              <h3>Fórmula</h3>
              <p><strong>NPS = % Promotores − % Detractores</strong></p>
            </section>

            <section class="modal-section">
              <h3>Ejemplo</h3>
              <p><strong>100 respuestas:</strong></p>
              <ul>
                <li>55 promotores</li>
                <li>25 pasivos</li>
                <li>20 detractores</li>
              </ul>
            </section>

            <section class="modal-section">
              <h3>Entonces</h3>
              <p><strong>NPS = 55% − 20%</strong></p>
              <p><strong>NPS = +35</strong></p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Importante</h3>
              <p>
                Los pasivos participan del total de respuestas, pero no aparecen directamente en la resta.
              </p>
            </section>
          `,
        },
        {
          title: "NPS NO es un porcentaje",
          html: `
            <section class="modal-section">
              <p>Este error aparece muchísimo en dashboards.</p>
            </section>

            <section class="modal-section">
              <p>Si tenemos:</p>
              <p><strong>NPS = 45</strong></p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>No significa</h3>
                <p>❌ “45% de satisfacción”</p>
                <p>❌ “45% de clientes recomienda”</p>
              </article>

              <article class="modal-section highlight-blue">
                <h3>Significa</h3>
                <p>
                  ✅ Existe una diferencia de <strong>45 puntos</strong> entre el porcentaje de promotores y detractores.
                </p>
              </article>
            </div>

            <section class="modal-section">
              <h3>Rango posible</h3>
              <p><strong>−100 ← 0 → +100</strong></p>
            </section>

            <section class="modal-section highlight-quote">
              <p>Por eso:</p>
              <p><strong>NPS es un índice, no un porcentaje.</strong></p>
            </section>
          `,
        },
        {
          title: "NPS y Laura",
          html: `
            <div class="image-slide">
              <img src="img/CX_npslaura.png" alt="Ejemplo de NPS con Laura" />
            </div>
          `,
        },
        {
          title: "El debate sobre NPS",
          html: `
            <section class="modal-section">
              <p>
                En 2003 se presentó NPS como una métrica estrechamente relacionada con el crecimiento.
              </p>
              <p>
                Pero la discusión académica continuó.
              </p>
            </section>

            <section class="modal-section">
              <p>
                En 2007, Keiningham, Cooil, Andreassen y Aksoy analizaron longitudinalmente la relación entre Net Promoter y crecimiento de ingresos y no confirmaron que NPS fuera sistemáticamente superior a otros indicadores.
              </p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>No significa</h3>
                <p>❌ “NPS no sirve”.</p>
              </article>

              <article class="modal-section highlight-blue">
                <h3>Significa</h3>
                <p>“NPS no debería convertirse en religión corporativa.”</p>
              </article>
            </div>

            <section class="modal-section highlight-quote">
              <h3>Conclusión correcta</h3>
              <p>Es una señal dentro de un sistema de medición.</p>
            </section>
          `,
        },
      ];

      initSlider(
        document.getElementById("slideTitle"),
        document.getElementById("slideContent"),
        document.getElementById("prevSlideBtn"),
        document.getElementById("nextSlideBtn"),
        slides
      );
    </script>
  </body>
</html>
