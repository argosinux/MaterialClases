<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase 4 - Diseño de servicios y omnicanalidad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="secondary-page">
    <main class="page-shell">
      <section class="page-card">
        <p class="eyebrow">Clase 4 - Diseño de servicios y omnicanalidad</p>

        <div class="slider-shell">
          <h2 id="slideTitle"></h2>
          <div id="slideContent" class="slide-content"></div>
          <div class="slider-nav">
            <button class="section-action-btn" id="prevSlideBtn" type="button" hidden>Anterior</button>
            <button class="section-action-btn" id="nextSlideBtn" type="button">Siguiente</button>
          </div>
        </div>

        <div class="detail-actions">
          <a class="back-link" href="customerexperience.html">← Volver a clases</a>
        </div>
      </section>
    </main>

    <script>
      function initSlider(titleEl, contentEl, prevBtn, nextBtn, slides) {
        let current = 0;

        function render() {
          const slide = slides[current];
          titleEl.textContent = slide.title;
          contentEl.innerHTML = slide.html;
          prevBtn.hidden = current === 0;
          nextBtn.disabled = current === slides.length - 1;
          nextBtn.textContent = current === slides.length - 1 ? 'Final' : 'Siguiente';
        }

        prevBtn.addEventListener('click', () => {
          current = Math.max(0, current - 1);
          render();
        });

        nextBtn.addEventListener('click', () => {
          current = Math.min(slides.length - 1, current + 1);
          render();
        });

        render();
      }

      const slides = [
        {
          title: 'La experiencia visible depende de una operación invisible',
          html: `
            <section class="modal-section">
              <p>
                Laura no sigue pagando solo por el café. Sigue pagando porque la caja llega a tiempo, el mensaje aparece cuando corresponde y todo parece estar bajo control.
              </p>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Idea central</h3>
              <p>
                CX no es solo diseñar lo que el cliente ve. Es diseñar lo que la empresa debe coordinar para que eso ocurra.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta generadora</h3>
              <p>
                ¿Alguna vez repitieron su problema tres veces a tres personas distintas de la misma empresa?
              </p>
            </section>
          `
        },
        {
          title: 'Service Design',
          html: `
            <div class="image-slide">
              <img src="img/CX_servicedesign.png" alt="Service Design" />
            </div>
          `
        },
        {
          title: 'De Customer Journey a Service Design',
          html: `
            <section class="modal-section">
              <p>
                El Journey muestra la película del cliente. Service Design muestra cómo se filma.
              </p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Customer Journey responde:</h3>
                <p>
                  ¿Qué vive el cliente?
                </p>
              </article>

              <article class="modal-section">
                <h3>Service Design responde:</h3>
                <p>
                  ¿Qué debe pasar dentro de la empresa para que eso sea posible?
                </p>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <h3>Ejemplo café</h3>
              <p>
                El cliente ve una caja linda.
              </p>
              <p>
                La empresa necesita stock, picking, etiqueta, courier, CRM y mensaje automático.
              </p>
            </section>
          `
        },
     {
          title: 'Service Design',
          html: `
            <div class="image-slide">
              <img src="img/CX_front.png" alt="Service Design" />
            </div>
          `
        },
        {
          title: 'Evidencia de servicio',
          html: `
            <section class="modal-section">
              <h3>Lo tangible tranquiliza cuando el servicio es invisible</h3>
              <p>
                En servicios, muchas cosas no se pueden tocar: una entrega, una reserva, una consulta médica, una suscripción. Por eso la evidencia física o digital ayuda a reducir incertidumbre.
              </p>
            </section>

            <section class="modal-section">
              <h3>Ejemplos</h3>
              <ul>
                <li>“Tu pedido fue despachado.”
                <li>Número de seguimiento.
                <li>Ticket de reclamo.
                <li>Foto del paquete entregado.
                <li>Mail de confirmación.
              </ul>
            </section>

            <section class="modal-section highlight-quote">
              <p>
                La evidencia no es decoración. Es prueba de que el sistema sigue vivo.
              </p>
            </section>
          `
        },
        {
          title: 'Backstage vs. Procesos de soporte',
          html: `
            <section class="modal-section">
              <p>
                No todo lo invisible es igual. Detrás del frontstage hay capas distintas, cada una a mayor distancia del cliente.
              </p>
            </section>

            <div class="modal-columns">
              <article class="modal-section">
                <h3>Backstage</h3>
                <p>
                  Personas y acciones que están directamente conectadas con lo que el cliente vive, aunque él no las vea.
                </p>
                <p class="example-text">
                  Ejemplo: el barista preparando el café, el agente armando la respuesta antes de enviarla, el picking de un pedido.
                </p>
              </article>

              <article class="modal-section">
                <h3>Procesos de soporte</h3>
                <p>
                  Sistemas, herramientas y áreas que permiten que el backstage funcione, sin relación directa con un cliente en particular.
                </p>
                <p class="example-text">
                  Ejemplo: el sistema de inventario, el servidor del CRM, la capacitación del equipo, las políticas de RRHH.
                </p>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                Si falla el backstage, el cliente lo nota casi de inmediato. Si falla un proceso de soporte, el cliente lo nota igual, pero más tarde: primero se cae el backstage, y recién ahí se ve en el frontstage.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta</h3>
              <p>
                Si el CRM se cae por una hora, ¿qué le pasa al cliente aunque nadie del backstage haya cometido un error?
              </p>
            </section>
          `
        },
        {
          title: 'El Service Blueprint',
          html: `
            <section class="modal-section">
              <h3>La radiografía del servicio</h3>
              <p>
                El Service Blueprint permite visualizar la relación entre acciones del cliente, interacciones visibles, acciones internas y procesos de soporte.
              </p>
              <p>
                El concepto viene de Lynn Shostack, quien en 1984 planteó que muchos problemas de servicio nacen por falta de diseño y control sistemático.
              </p>
            </section>

            <section class="modal-section">
              <h3>Capas clave</h3>
              <ul>
                <li><strong>Evidencia física/digital.</strong> Las señales tangibles que percibe el cliente y que le confirman que el servicio está ocurriendo: un mensaje, un ticket, una foto de entrega.
                <li><strong>Acciones del cliente.</strong> Los pasos que el cliente realiza por su cuenta: buscar, comparar, pagar, reclamar, usar el producto.
                <li><strong>Frontstage.</strong> Las interacciones visibles entre el cliente y la empresa: personas, pantallas, canales de atención.
                <li><strong>Backstage.</strong> Las acciones internas directamente conectadas con lo que el cliente vive, aunque no las vea.
                <li><strong>Procesos de soporte.</strong> Los sistemas y áreas que permiten que el backstage funcione: inventario, CRM, capacitación, políticas internas.
              </ul>
            </section>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                El Blueprint no describe cómo se ve el servicio. Describe cómo se sostiene: qué capa depende de cuál, y dónde se rompe la cadena cuando algo falla.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta</h3>
              <p>
                Si dibujaran el Blueprint de un servicio que usan seguido, ¿en qué capa creen que está el mayor riesgo de falla?
              </p>
            </section>
          `
        },
        {
          title: 'Las tres líneas del Blueprint',
          html: `
            <section class="modal-section">
              <h3>Dónde se ve, dónde se oculta, dónde se coordina</h3>
              <p>
                El Blueprint no es solo una lista de capas: son capas separadas por líneas. Cada línea marca un cambio de responsable, y es justo ahí donde suele nacer la fricción.
              </p>
            </section>

            <div class="evolution-grid">
              <article class="evolution-card">
                <h3>Línea de interacción</h3>
                <p>
                  Separa al cliente de la empresa. Arriba está lo que el cliente hace por su cuenta; debajo, lo que la empresa responde.
                </p>
                <p class="example-text">
                  Ejemplo: el cliente hace clic en “comprar” (arriba). El sistema confirma el pago (debajo).
                </p>
              </article>

              <article class="evolution-card">
                <h3>Línea de visibilidad</h3>
                <p>
                  Separa lo visible de lo invisible: el frontstage del backstage. Arriba, lo que el cliente puede ver; debajo, lo que ocurre sin que lo perciba.
                </p>
                <p class="example-text">
                  Ejemplo: el cliente ve al mesero tomar el pedido (frontstage). No ve al cocinero prepararlo (backstage).
                </p>
              </article>

              <article class="evolution-card">
                <h3>Línea de interacción interna</h3>
                <p>
                  Separa el backstage de los procesos de soporte. Arriba, quienes ejecutan el servicio en tiempo real; debajo, los sistemas y áreas que lo hacen posible.
                </p>
                <p class="example-text">
                  Ejemplo: el agente responde un reclamo (backstage) apoyado en el CRM y una base de conocimiento (soporte interno).
                </p>
              </article>
            </div>

            <section class="modal-section highlight-blue">
              <h3>Punto clave</h3>
              <p>
                Cada línea es un punto de posible fricción. Cuando un cliente termina haciendo el trabajo de la empresa, se cruzó mal la línea de interacción. Cuando se queda sin información y genera ansiedad, se gestionó mal la línea de visibilidad. Cuando el backstage no puede sostener lo que promete, falló algo bajo la línea de interacción interna.
              </p>
              <p>
                Diagnosticar un problema de CX es, muchas veces, preguntar en qué línea se rompió la cadena.
              </p>
            </section>

            <section class="modal-section highlight-quote">
              <h3>Pregunta</h3>
              <p>
                La próxima vez que un cliente reciba una respuesta contradictoria de dos personas distintas de la misma empresa, ¿en qué línea del Blueprint ubicarían el problema?
              </p>
            </section>
          `
        },
        {
          title: 'Service Blueprint',
          html: `
            <div class="image-slide">
              <img src="img/CX_serviceblue.png" alt="Service Service Blue" />
            </div>
          `
        },
       {
          title: 'Service Blueprint',
          html: `
            <div class="image-slide">
              <img src="img/CX_laurablue.png" alt="Service Service Blue" />
            </div>
          `
        },

      ];

      initSlider(
        document.getElementById('slideTitle'),
        document.getElementById('slideContent'),
        document.getElementById('prevSlideBtn'),
        document.getElementById('nextSlideBtn'),
        slides
      );
    </script>
  </body>
</html>
